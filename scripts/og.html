<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Public+Sans:wght@400;500&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0E1116;color:#E9EBE6;font-family:"Public Sans",system-ui,sans-serif}
  .card{position:relative;width:1200px;height:630px;padding:64px 72px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  canvas{position:absolute;inset:0}
  .brand{display:flex;align-items:center;gap:14px;font:500 30px "Newsreader",Georgia,serif;color:#fff;position:relative}
  .brand small{font:500 13px "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:#9AA3AD;margin-left:14px;padding-left:16px;border-left:1px solid #2A313B}
  .eyebrow{font:500 15px "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:#9AA3AD;display:flex;align-items:center;gap:12px;position:relative}
  .eyebrow::before{content:"";width:9px;height:9px;border-radius:50%;background:#F5D58A;box-shadow:0 0 0 4px rgba(245,213,138,.18),0 0 18px rgba(245,213,138,.6)}

  p{margin:0;font-size:24px;line-height:1.4;max-width:760px;color:#E9EBE6;position:relative}
</style></head>
<body><div class="card">
<canvas id="c" width="1200" height="630"></canvas>
<div class="brand"><svg viewBox="0 0 48 48" width="40" height="40"><circle cx="15" cy="33" r="8" fill="#fff"/><path d="M25 26 L41 12 M28 32 L45 26 M21 21 L27 5" stroke="#C41E5C" stroke-width="4" stroke-linecap="round" fill="none"/></svg>The Hope Group<small>Ethical AI Lab · Boston</small></div>
<div>
<div class="eyebrow">Boston · Ethical AI Lab · Since 2021</div>
<h1>We build AI the way it <em>should</em> be built.</h1>
<p>Privacy-first software, audited for bias, with people in control. hopegroup.ai</p>
</div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let s=7;const r=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;
const ox=1240,oy=280,ang=Math.PI+0.12,half=0.2;const g=x.createRadialGradient(ox,oy,0,ox,oy,1300);g.addColorStop(0,'rgba(245,213,138,.22)');g.addColorStop(1,'rgba(245,213,138,0)');
x.beginPath();x.moveTo(ox,oy);x.arc(ox,oy,1400,ang-half,ang+half);x.closePath();x.fillStyle=g;x.fill();
const pts=[];for(let i=0;i<260;i++){const px=500+r()*720,py=r()*630;pts.push({x:px,y:py,r:1.2+r()*1.8});}
for(const p of pts){const a=Math.atan2(p.y-oy,p.x-ox);const da=Math.abs(((a-ang+Math.PI*3)%(Math.PI*2))-Math.PI);const l=Math.max(0,1-da/half);
x.beginPath();x.arc(p.x,p.y,p.r+l*1.8,0,Math.PI*2);x.fillStyle=`rgba(${126+119*l|0},${138+75*l|0},${150-12*l|0},${.3+.7*l})`;x.fill();}
const gl=x.createRadialGradient(1180,oy,0,1180,oy,70);gl.addColorStop(0,'rgba(196,30,92,.6)');gl.addColorStop(1,'rgba(196,30,92,0)');x.fillStyle=gl;x.beginPath();x.arc(1180,oy,70,0,7);x.fill();x.fillStyle='#F5D58A';x.beginPath();x.arc(1180,oy,5,0,7);x.fill();
</script></body></html>
